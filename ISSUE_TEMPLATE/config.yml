blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/OpenSecOps-Org/.github/blob/main/SECURITY.md
    about: Use the "Security" tab on the affected component repository → "Report a vulnerability" to open a private advisory. Fallback channel — security@opensecops.org.
  - name: Documentation issue
    url: https://github.com/OpenSecOps-Org/Documentation/issues/new
    about: Open documentation issues on the Documentation repository directly.
  - name: General question or discussion
    url: https://github.com/OpenSecOps-Org/.github/discussions
    about: User-to-user discussion. Maintainer participation is not implied.
  - name: Trust page (supply-chain posture and verification)
    url: https://www.opensecops.org/trust.html
    about: Posture, governance model, release verification recipes.
